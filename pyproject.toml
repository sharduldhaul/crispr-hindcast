[project]
name = "crispr-hindcast"
version = "0.1.0"
description = "Time-sliced belief revision over public CRISPR screen evidence, graded against subsequent literature."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Shardul Dhaul" }]
dependencies = [
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[project.scripts]
hindcast = "hindcast.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
