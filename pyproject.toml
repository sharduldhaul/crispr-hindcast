[project]
name = "crispr-hindcast"
version = "0.1.0"
description = "Time-sliced belief revision over public CRISPR screen evidence, graded against subsequent literature."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Shardul Dhaul" }]
dependencies = [
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "rich>=13.7",
]

[project.optional-dependencies]
# ruff is pinned exactly so a new release cannot change the lint result.
# numpy is here because the retrieval tests search fake vectors with it.
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff==0.17.3", "numpy>=2,<3"]
# Needed only for a live model call or to compute retrieval. Replaying committed
# responses and retrieval records needs none of it.
llm = ["google-genai>=3.3,<3.4", "numpy>=2,<3", "fastembed>=0.5,<1"]

[project.scripts]
hindcast = "hindcast.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ISC", "FURB", "RUF"]
ignore = [
  "B008",  # typer declares options as calls in argument defaults
  "RUF001",  # Greek letters in gene and globin names are data, not typos
  "E501",  # line length is the formatter's job; long strings stay readable
]
